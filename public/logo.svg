<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Opening bracket -->
  <text x="0" y="38" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="36" font-weight="700" fill="url(#grad)">&lt;</text>
  <!-- "Code" in foreground -->
  <text x="22" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#e2e8f0">Code</text>
  <!-- "FromScratch" in gradient -->
  <text x="114" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#grad)">FromScratch</text>
  <!-- Closing slash-bracket -->
  <text x="330" y="38" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', monospace" font-size="36" font-weight="700" fill="url(#grad)">/&gt;</text>
</svg>
