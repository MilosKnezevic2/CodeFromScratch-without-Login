name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Audit (high + critical only — Firm B L3 exception A2)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          NEXTAUTH_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"

      # Blocking since the 2026-07 resilience work: the build no longer
      # needs a reachable Sanity (build-safe reads degrade to fallbacks),
      # a database, or a real Resend key — so a red build here is a real
      # regression, not missing credentials. The project id is the public
      # one already committed in sanity.cli.ts; published content needs no
      # token to read.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://codefromscratch.org"
          NEXT_PUBLIC_SANITY_PROJECT_ID: "jkgmggst"
          NEXT_PUBLIC_SANITY_DATASET: "production"
          NEXTAUTH_SECRET: "ci-placeholder-0123456789abcdef0123456789abcdef"
          NEXTAUTH_URL: "https://codefromscratch.org"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
          RESEND_API_KEY: "re_ci_placeholder"
          EMAIL_FROM: "noreply@example.com"
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          STRIPE_PRO_MONTHLY_PRICE_ID: "price_ci_placeholder"
          STRIPE_PRO_ANNUAL_PRICE_ID: "price_ci_placeholder"
          CFS_ADMIN_USERNAME: "ci-admin"
          CFS_ADMIN_PASSWORD: "ci-password"
