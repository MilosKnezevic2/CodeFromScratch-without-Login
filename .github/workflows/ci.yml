name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - run: npm ci

      - name: Audit (high + critical only — Firm B L3 exception A2)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          NEXTAUTH_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"

      # Non-blocking — build requires real Sanity dataset (static pages fetch
      # content at build time). Until a CI-dedicated Sanity project + token
      # are added as repository secrets, build signal is advisory only.
      # Lint + type-check + test remain blocking.
      - name: Build
        continue-on-error: true
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://codefromscratch.org"
          NEXT_PUBLIC_SANITY_PROJECT_ID: "placeholder"
          NEXT_PUBLIC_SANITY_DATASET: "production"
          NEXTAUTH_SECRET: "ci-placeholder-0123456789abcdef0123456789abcdef"
          NEXTAUTH_URL: "https://codefromscratch.org"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
          RESEND_API_KEY: "re_ci_placeholder"
          EMAIL_FROM: "noreply@example.com"
          STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
          STRIPE_PRO_MONTHLY_PRICE_ID: "price_ci_placeholder"
          STRIPE_PRO_ANNUAL_PRICE_ID: "price_ci_placeholder"
          CFS_ADMIN_USERNAME: "ci-admin"
          CFS_ADMIN_PASSWORD: "ci-password"
